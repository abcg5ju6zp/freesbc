# systemd drop-in for the freesbc.service shipped in the release archive:
#   install -D -m 0644 freesbc-load.conf /etc/systemd/system/freesbc.service.d/load.conf
#   systemctl daemon-reload
[Service]
# The shipped unit allows 65536 descriptors. A load test needs 4 UDP sockets
# per anchored call (8 for T2/T4), so raise it; Go lifts the soft limit to it.
LimitNOFILE=1048576
# FreeSBC logs ~2 Info lines per call ("proxying INVITE ...", "call ended")
# and has no level flag. journald's default limit (10000 per 30 s) would
# silently drop them above ~160 CPS, so lift it for this unit.
LogRateLimitIntervalSec=0
